server:
  port: ${MALL_PORTAL_PORT:8085}
spring:
  datasource:
    url: jdbc:mysql://${MALL_DB_HOST:localhost}:${MALL_DB_PORT:13306}/${MALL_DB_NAME:mall}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MALL_DB_USER:mall}
    password: ${MALL_DB_PASSWORD:mall-local-only}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      stat-view-servlet:
        enabled: false
  data:
    mongodb:
      host: ${MALL_MONGO_HOST:localhost}
      port: ${MALL_MONGO_PORT:27018}
      database: mall-port
    redis:
      host: ${MALL_REDIS_HOST:localhost}
      port: ${MALL_REDIS_PORT:16379}
      database: 0
      password: ${MALL_REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${MALL_RABBIT_HOST:localhost}
    port: ${MALL_RABBIT_PORT:5673}
    virtual-host: /mall
    username: ${MALL_RABBIT_USER:mall}
    password: ${MALL_RABBIT_PASSWORD:mall-rabbit-local-only}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
jwt:
  secret: ${MALL_JWT_SECRET:local-demo-only-change-before-deployment-0123456789-abcdefghijklmnopqrstuvwxyz}
logging:
  level:
    root: info
    com.macro.mall: info
logstash:
  host: localhost
  enableInnerLog: false
alipay:
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  appId: ${MALL_ALIPAY_APP_ID:}
  appPrivateKey: ${MALL_ALIPAY_PRIVATE_KEY:}
  alipayPublicKey: ${MALL_ALIPAY_PUBLIC_KEY:}
  returnUrl: ${MALL_ALIPAY_RETURN_URL:http://localhost:5173/}
  notifyUrl: ${MALL_ALIPAY_NOTIFY_URL:}
